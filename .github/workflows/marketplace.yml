# Validates every block/command module and checks the committed catalog
# (.lineadraw/marketplace.json) matches the sources in this commit.
# Stale catalog? Run `npx lineadraw manifest` and commit the result.
name: Marketplace
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx lineadraw check
